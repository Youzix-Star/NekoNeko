plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace "top.youzix.nekoneko"

    defaultConfig {
        applicationId "top.youzix.nekoneko"
        minSdk 21
        targetSdk 33
        versionCode 50
        versionName "1.6.1"
    }

    signingConfigs {
        release {
            def keystoreFile = file("nekoneko.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                def envPass = System.getenv("KEYSTORE_PASSWORD")
                storePassword envPass != null ? envPass : "ADMIN.wxd1y12r"
                def envAlias = System.getenv("KEY_ALIAS")
                keyAlias envAlias != null ? envAlias : "nekoneko"
                def envKeyPass = System.getenv("KEY_PASSWORD")
                keyPassword envKeyPass != null ? envKeyPass : "ADMIN.wxd1y12r"
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
