plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk 37
    namespace "top.youzix.nekoneko"

    defaultConfig {
        applicationId "top.youzix.nekoneko"
        minSdk 23
        targetSdk 34
        versionCode 95
        versionName "1.13.0-alpha.3"
    }

    signingConfigs {
        release {
            def keystoreFile = file("nekoneko.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                def envPass = System.getenv("KEYSTORE_PASSWORD")
                storePassword envPass != null ? envPass : "ADMIN.wxd1y12r"
                def envAlias = System.getenv("KEY_ALIAS")
                keyAlias envAlias != null ? envAlias : "nekoneko"
                def envKeyPass = System.getenv("KEY_PASSWORD")
                keyPassword envKeyPass != null ? envKeyPass : "ADMIN.wxd1y12r"
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        compose true
    }
}

kotlin {
    jvmToolchain(17)
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Compose BOM — controls all Compose library versions
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material3:material3-window-size-class'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.compose.foundation:foundation'

    // AndroidX integration
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.fragment:fragment-compose:1.8.6'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'

    // Navigation Compose (Navigation 2 — stable)
    implementation 'androidx.navigation:navigation-compose:2.9.0'

    // Coil — image loading (Compose Multiplatform)
    implementation 'io.coil-kt.coil3:coil-compose:3.2.0'

    // Debug
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
