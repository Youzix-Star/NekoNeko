plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    compileSdk 34
    namespace "top.youzix.nekoneko"

    defaultConfig {
        applicationId "top.youzix.nekoneko"
        minSdk 21
        targetSdk 33
        versionCode 89
        versionName "1.12.0-alpha.2"
    }

    signingConfigs {
        release {
            def keystoreFile = file("nekoneko.jks")
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                def envPass = System.getenv("KEYSTORE_PASSWORD")
                storePassword envPass != null ? envPass : "ADMIN.wxd1y12r"
                def envAlias = System.getenv("KEY_ALIAS")
                keyAlias envAlias != null ? envAlias : "nekoneko"
                def envKeyPass = System.getenv("KEY_PASSWORD")
                keyPassword envKeyPass != null ? envKeyPass : "ADMIN.wxd1y12r"
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    composeOptions {
        kotlinCompilerExtensionVersion = '1.5.10'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2024.12.01')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.runtime:runtime-livedata'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.fragment:fragment-compose:1.8.5'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
