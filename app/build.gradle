plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    namespace "top.youzix.nekoneko"

    defaultConfig {
        applicationId "top.youzix.nekoneko"
        minSdk 21
        targetSdk 33
        versionCode 39
        versionName "1.4.3"
    }

    signingConfigs {
        release {
            def keystoreFile = file("nekoneko.jks")
            def keystorePassword = System.getenv("KEYSTORE_PASSWORD") ?: (keystoreFile.exists() ? "ADMIN.wxd1y12r" : null)
            def keyAlias = System.getenv("KEY_ALIAS") ?: (keystoreFile.exists() ? "nekoneko" : null)
            def keyPassword = System.getenv("KEY_PASSWORD") ?: (keystoreFile.exists() ? "ADMIN.wxd1y12r" : null)
            if (keystoreFile.exists() && keystorePassword != null) {
                storeFile keystoreFile
                storePassword keystorePassword
                keyAlias keyAlias
                keyPassword keyPassword
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
}
